<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>俄罗斯方块 - Tetris</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Segoe UI', 'PingFang SC', sans-serif;
  color: #fff;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}

/* ====== 桌面布局 ====== */
#game-wrapper {
  display: flex;
  gap: 24px;
  align-items: flex-start;
}
canvas { border-radius: 8px; background: #111; }
#sidebar {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 160px;
}
.panel {
  background: rgba(255,255,255,0.05);
  border-radius: 8px;
  padding: 16px;
  border: 1px solid rgba(255,255,255,0.1);
}
.panel h3 {
  font-size: 12px; text-transform: uppercase; color: #888; margin-bottom: 8px; letter-spacing: 2px;
}
.panel .value {
  font-size: 28px; font-weight: bold;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#next-canvas { border-radius: 4px; background: #111; }
#controls-info { font-size: 12px; line-height: 2; color: #aaa; }
#controls-info kbd { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 3px; font-size: 11px; }

/* ====== GAME OVER / START OVERLAY ====== */
#overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.8); justify-content: center; align-items: center;
  flex-direction: column; z-index: 10;
}
#overlay.show { display: flex; }
#overlay h1 {
  font-size: 48px; margin-bottom: 16px;
  background: linear-gradient(135deg, #f093fb, #f5576c);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#overlay p { font-size: 24px; margin-bottom: 24px; }
#restart-btn {
  padding: 12px 32px; font-size: 18px; border: none; border-radius: 8px;
  background: linear-gradient(135deg, #667eea, #764ba2); color: white; cursor: pointer;
  transition: transform 0.2s;
}
#restart-btn:hover { transform: scale(1.05); }

/* ====== Game Boy 手柄布局（手机紧凑版）===== */
#gameboy {
  display: none;
  width: min(340px, 96vw);
  background: #2a2a4a;
  border-radius: 20px 20px 50px 50px;
  padding: 12px 14px 24px;
  box-shadow: inset 0 -3px 10px rgba(0,0,0,0.4), 0 6px 24px rgba(0,0,0,0.5);
}
#gb-screen { text-align: center; }
#gb-canvas {
  border-radius: 8px; background: #000; display: block; margin: 0 auto;
}
#gb-stats {
  display: flex; justify-content: space-around; margin-top: 6px;
  font-size: 12px; color: #aaa;
}
#gb-stats span { color: #667eea; font-weight: bold; }

/* D-Pad */
#dpad {
  position: relative; width: 130px; height: 130px; margin: 8px auto 12px;
}
#dpad .dpad-btn {
  position: absolute; width: 40px; height: 40px;
  background: #1a1a3a; border: 2px solid rgba(255,255,255,0.15);
  border-radius: 6px; color: #ccc; font-size: 18px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
#dpad .dpad-btn:active { background: rgba(102,126,234,0.5); }
#dpad .dpad-up    { top: 0; left: 45px; border-radius: 8px 8px 0 0; }
#dpad .dpad-down  { bottom: 0; left: 45px; border-radius: 0 0 8px 8px; }
#dpad .dpad-left  { top: 45px; left: 0; border-radius: 8px 0 0 8px; }
#dpad .dpad-right { top: 45px; right: 0; border-radius: 0 8px 8px 0; }
#dpad .dpad-center { top: 45px; left: 45px; pointer-events: none; }

/* Action buttons */
#actions {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 4px; padding: 0 6px;
}
.action-btn {
  width: 56px; height: 56px; border-radius: 50%;
  font-size: 13px; font-weight: bold; border: none; color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
#btn-rotate {
  background: radial-gradient(circle at 30% 30%, #f093fb, #764ba2);
  box-shadow: 0 3px 8px rgba(118,75,162,0.5);
}
#btn-rotate:active { transform: scale(0.92); }
#btn-drop {
  background: radial-gradient(circle at 30% 30%, #667eea, #4a3ab2);
  box-shadow: 0 3px 8px rgba(74,58,178,0.5);
}
#btn-drop:active { transform: scale(0.92); }

#pause-btn {
  background: transparent; border: 2px solid rgba(255,255,255,0.3); color: #aaa;
  width: 32px; height: 32px; border-radius: 50%; font-size: 14px; cursor: pointer;
}

/* ====== 手机端响应式 ====== */
@media (max-width: 768px) {
  body { align-items: flex-start; padding-top: env(safe-area-inset-top, 6px); }
  #game-wrapper, #mobile-controls { display: none !important; }
  #gameboy { display: block; margin: auto; }
}
@media (min-width: 769px) {
  #gameboy { display: none !important; }
}
</style>
</head>
<body>

<!-- ====== 桌面版布局 ====== -->
<div id="game-wrapper">
  <canvas id="game" width="300" height="600"></canvas>
  <div id="sidebar">
    <div class="panel"><h3>得分</h3><div class="value" id="score">0</div></div>
    <div class="panel"><h3>等级</h3><div class="value" id="level">1</div></div>
    <div class="panel"><h3>行数</h3><div class="value" id="lines">0</div></div>
    <div class="panel"><h3>下一个</h3><canvas id="next-canvas" width="120" height="120"></canvas></div>
    <div class="panel" id="controls-info">
      <h3>操作</h3>
      ← → 左右移动<br>↑ / 空格 旋转<br>↓ 加速下落<br>P 暂停
    </div>
  </div>
</div>

<!-- ====== 游戏手柄布局（手机）===== -->
<div id="gameboy">
  <div id="gb-screen">
    <canvas id="gb-canvas" width="270" height="400"></canvas>
    <div id="gb-stats">
      <div><div>得分</div><span id="gb-score">0</span></div>
      <div><div>等级</div><span id="gb-level">1</span></div>
      <div><div>行数</div><span id="gb-lines">0</span></div>
    </div>
  </div>
  <div id="dpad">
    <div class="dpad-btn dpad-up" data-action="rotate">&#8635;</div>
    <div class="dpad-btn dpad-down" data-action="down">&darr;</div>
    <div class="dpad-btn dpad-left" data-action="left">&larr;</div>
    <div class="dpad-btn dpad-right" data-action="right">&rarr;</div>
    <div class="dpad-btn dpad-center"></div>
  </div>
  <div id="actions">
    <button class="action-btn" id="btn-rotate">旋转</button>
    <button id="pause-btn">II</button>
    <button class="action-btn" id="btn-drop">硬降</button>
  </div>
</div>

<!-- ====== 覆盖层 ====== -->
<div id="overlay">
  <h1 id="overlay-title"></h1>
  <p id="overlay-msg"></p>
  <button id="restart-btn">重新开始</button>
</div>

<script>
const COLS = 10, ROWS = 20;

// ===== DOM =====
let canvas, ctx, BLOCK;
if (window.innerWidth <= 768) {
  canvas = document.getElementById('gb-canvas');
  ctx = canvas.getContext('2d');
} else {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
}
BLOCK = canvas.width / COLS;

let nextCanvas, nextCtx;
if (window.innerWidth > 768) {
  nextCanvas = document.getElementById('next-canvas');
  nextCtx = nextCanvas.getContext('2d');
}
const NEXT_BLOCK = 24;

// ===== 游戏状态 =====
const SHAPES = {
  I: { shape: [[1,1,1,1]], color: '#00f0f0' },
  O: { shape: [[1,1],[1,1]], color: '#f0f000' },
  T: { shape: [[0,1,0],[1,1,1]], color: '#a000f0' },
  S: { shape: [[0,1,1],[1,1,0]], color: '#00f000' },
  Z: { shape: [[1,1,0],[0,1,1]], color: '#f00000' },
  J: { shape: [[1,0,0],[1,1,1]], color: '#0000f0' },
  L: { shape: [[0,0,1],[1,1,1]], color: '#f0a000' }
};
const SHAPE_NAMES = Object.keys(SHAPES);

let board = [], current = null, nextPiece = null;
let score = 0, level = 1, linesCount = 0;
let gameRunning = false, paused = false;
let dropInterval = 800, lastDrop = 0, animFrameId = null;

function initBoard() { board = Array.from({length: ROWS}, () => Array(COLS).fill(0)); }

function createPiece(name) {
  const s = SHAPES[name];
  return { shape: s.shape.map(r => [...r]), color: s.color, x: Math.floor((COLS - s.shape[0].length) / 2), y: 0 };
}
function randomPiece() { return createPiece(SHAPE_NAMES[Math.floor(Math.random() * SHAPE_NAMES.length)]); }

function checkCollision(shape, px, py) {
  for (let r = 0; r < shape.length; r++)
    for (let c = 0; c < shape[r].length; c++)
      if (shape[r][c]) {
        const nx = px + c, ny = py + r;
        if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
        if (ny >= 0 && board[ny][nx]) return true;
      }
  return false;
}

function rotatePiece(piece) {
  const s = piece.shape, rows = s.length, cols = s[0].length;
  const rotated = Array.from({length: cols}, () => Array(rows).fill(0));
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) rotated[c][rows - 1 - r] = s[r][c];
  const kicks = [0, -1, 1, -2, 2];
  for (const k of kicks)
    if (!checkCollision(rotated, piece.x + k, piece.y)) { piece.shape = rotated; piece.x += k; return; }
}

// 幽灵块：计算落点（始终在底部）
function getGhostY() {
  let gy = 0;
  while (!checkCollision(current.shape, current.x, current.y + gy + 1)) gy++;
  return current.y + gy;
}

// 方块锁定 → 先消除行得分，再出新块
function lockPiece() {
  for (let r = 0; r < current.shape.length; r++)
    for (let c = 0; c < current.shape[r].length; c++)
      if (current.shape[r][c]) {
        const y = current.y + r, x = current.x + c;
        if (y < 0) { gameOver(); return; }
        board[y][x] = current.color;
      }
  clearLines(); // 消除行得分
  spawnPiece();
}

// 消除行 → 得分（经典计分法：1=100, 2=300, 3=500, 4=800）
function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(c => c !== 0)) {
      board.splice(r, 1); board.unshift(Array(COLS).fill(0)); cleared++; r++; }
  }
  if (cleared > 0) {
    const pts = [0, 100, 300, 500, 800];
    score += pts[cleared] * level;
    linesCount += cleared;
    level = Math.floor(linesCount / 10) + 1;
    dropInterval = Math.max(100, 800 - (level - 1) * 60);
    updateUI();
  }
}

function spawnPiece() {
  current = nextPiece || randomPiece();
  nextPiece = randomPiece();
  if (checkCollision(current.shape, current.x, current.y)) gameOver();
  if (nextCtx) drawNext();
}

// ===== 绘制 =====
function drawBlock(ctx2, x, y, color, size, ghost) {
  if (ghost) {
    ctx2.strokeStyle = color; ctx2.lineWidth = 1.5;
    ctx2.globalAlpha = 0.35;
    // 虚线方框 + 半透明填充
    ctx2.setLineDash([4, 4]);
    ctx2.strokeRect(x * size + 2, y * size + 2, size - 4, size - 4);
    ctx2.setLineDash([]);
    ctx2.fillStyle = color;
    ctx2.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
    ctx2.globalAlpha = 1;
    return;
  }
  ctx2.fillStyle = color;
  ctx2.fillRect(x * size, y * size, size, size);
  // 高光
  ctx2.fillStyle = 'rgba(255,255,255,0.2)';
  ctx2.fillRect(x * size, y * size, size, 2);
  ctx2.fillRect(x * size, y * size, 2, size);
  // 阴影
  ctx2.fillStyle = 'rgba(0,0,0,0.3)';
  ctx2.fillRect(x * size + size - 2, y * size, 2, size);
  ctx2.fillRect(x * size, y * size + size - 2, size, 2);
  ctx2.strokeStyle = 'rgba(0,0,0,0.5)'; ctx2.lineWidth = 1;
  ctx2.strokeRect(x * size, y * size, size, size);
}

function drawBoard() {
  ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  // 网格
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    ctx.strokeRect(c * BLOCK, r * BLOCK, BLOCK, BLOCK);
  // 已锁定方块
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    if (board[r][c]) drawBlock(ctx, c, r, board[r][c], BLOCK);
  // 幽灵块（始终在落点，不随方块移动）
  if (current && gameRunning) {
    const ghostY = getGhostY();
    for (let r = 0; r < current.shape.length; r++)
      for (let c = 0; c < current.shape[r].length; c++)
        if (current.shape[r][c])
          drawBlock(ctx, current.x + c, ghostY + r, current.color, BLOCK, true);
    // 实块
    for (let r = 0; r < current.shape.length; r++)
      for (let c = 0; c < current.shape[r].length; c++)
        if (current.shape[r][c])
          drawBlock(ctx, current.x + c, current.y + r, current.color, BLOCK);
  }
}

function drawNext() {
  nextCtx.fillStyle = '#111'; nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (!nextPiece) return;
  const s = nextPiece.shape;
  const ox = Math.floor((COLS - s[0].length) / 2), oy = Math.floor((5 - s.length) / 2);
  for (let r = 0; r < s.length; r++)
    for (let c = 0; c < s[r].length; c++)
      if (s[r][c]) drawBlock(nextCtx, ox + c, oy + r, nextPiece.color, NEXT_BLOCK);
}

function updateUI() {
  const scoreEl = document.getElementById('score'), levelEl = document.getElementById('level');
  const linesEl = document.getElementById('lines');
  if (scoreEl) scoreEl.textContent = score;
  if (levelEl) levelEl.textContent = level;
  if (linesEl) linesEl.textContent = linesCount;
  // 手机面板
  const gs = document.getElementById('gb-score'), gl = document.getElementById('gb-level');
  const gn = document.getElementById('gb-lines');
  if (gs) gs.textContent = score; if (gl) gl.textContent = level; if (gn) gn.textContent = linesCount;
}

// ===== 主循环 =====
function gameLoop(ts) {
  if (!gameRunning || paused) return;
  if (ts - lastDrop > dropInterval) { moveDown(); lastDrop = ts; }
  drawBoard();
  animFrameId = requestAnimationFrame(gameLoop);
}

// ===== 操作（修复：移动和软降不再得分）=====
function moveLeft()   { if (gameRunning && !paused && !checkCollision(current.shape, current.x - 1, current.y)) current.x--; }
function moveRight()  { if (gameRunning && !paused && !checkCollision(current.shape, current.x + 1, current.y)) current.x++; }
// 软降：只加速下落，不加分（经典规则：只有消除行才得分）
function moveDown()   { if (!gameRunning || paused) return; if (!checkCollision(current.shape, current.x, current.y + 1)) current.y++; else lockPiece(); }
// 硬降：一次性落底，得分为移动距离*2（硬降奖励分）
function hardDrop()   { if (!gameRunning || paused) return; let dy = 0; while (!checkCollision(current.shape, current.x, current.y + dy + 1)) dy++; score += dy * 2; current.y += dy; updateUI(); lockPiece(); }
function doRotate()   { if (gameRunning && !paused) rotatePiece(current); }

// ===== 键盘 =====
document.addEventListener('keydown', e => {
  switch(e.code) {
    case 'ArrowLeft':  e.preventDefault(); moveLeft(); break;
    case 'ArrowRight': e.preventDefault(); moveRight(); break;
    case 'ArrowDown':  e.preventDefault(); moveDown(); break;
    case 'ArrowUp':    e.preventDefault(); doRotate(); break;
    case 'Space':      e.preventDefault(); doRotate(); break; // 空格改为旋转
    case 'KeyP':       if (gameRunning) paused = !paused; break;
    case 'Enter':      if (!gameRunning) startGame(); break;
  }
});

// ===== 游戏手柄按钮（手机）=====
function bindBtn(id, fn) {
  const el = document.getElementById(id);
  if (!el) return;
  ['touchstart', 'mousedown'].forEach(evt =>
    el.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); fn(); })
  );
}

// D-pad（长按加速移动）
let dpadInterval = null;
function dpadStart(action) {
  if (!gameRunning || paused) return;
  const actions = { left: moveLeft, right: moveRight, down: moveDown, rotate: doRotate };
  if (actions[action]) actions[action]();
  dpadInterval = setInterval(() => { if (actions[action]) actions[action](); }, 120);
}
function dpadEnd() { clearInterval(dpadInterval); dpadInterval = null; }

document.querySelectorAll('.dpad-btn[data-action]').forEach(btn => {
  const action = btn.dataset.action;
  ['touchstart', 'mousedown'].forEach(evt => btn.addEventListener(evt, e => { e.preventDefault(); dpadStart(action); }));
  ['touchend', 'mouseup', 'mouseleave'].forEach(evt => btn.addEventListener(evt, () => dpadEnd()));
});

// 硬降按钮（长按连续触发）
let hardDropTimer = null;
const btnDrop = document.getElementById('btn-drop');
if (btnDrop) {
  const startHard = () => { if (!gameRunning || paused) return; hardDrop(); hardDropTimer = setInterval(hardDrop, 80); };
  const stopHard = () => clearInterval(hardDropTimer);
  ['touchstart','mousedown'].forEach(e => btnDrop.addEventListener(e, e2 => { e2.preventDefault(); startHard(); }));
  ['touchend','mouseup','mouseleave'].forEach(e => btnDrop.addEventListener(e, stopHard));
}

bindBtn('btn-rotate', doRotate);
const pauseBtn = document.getElementById('pause-btn');
if (pauseBtn) bindBtn('pause-btn', () => { if (gameRunning) paused = !paused; });

// ===== 桌面面板按钮 =====
function bindMobile(id, fn) {
  const el = document.getElementById(id);
  if (!el) return;
  ['touchstart', 'mousedown'].forEach(evt => el.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); fn(); }));
}
// 注意：桌面版 m-down 也不再加分（已由 moveDown 函数处理）
bindMobile('m-left', moveLeft); bindMobile('m-right', moveRight);
bindMobile('m-down', moveDown); bindMobile('m-rotate', doRotate); bindMobile('m-drop', hardDrop);

// ===== 覆盖层 =====
function showOverlay(title, msg) {
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-msg').textContent = msg;
  document.getElementById('overlay').classList.add('show');
}
function hideOverlay() { document.getElementById('overlay').classList.remove('show'); }
document.getElementById('restart-btn').addEventListener('click', () => { hideOverlay(); startGame(); });

// ===== 游戏控制 =====
function startGame() {
  initBoard(); score = 0; level = 1; linesCount = 0; dropInterval = 800;
  gameRunning = true; paused = false; nextPiece = null;
  updateUI(); spawnPiece(); hideOverlay();
  lastDrop = performance.now();
  if (animFrameId) cancelAnimationFrame(animFrameId);
  animFrameId = requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  showOverlay('GAME OVER', `得分: ${score}`);
}

function drawStartScreen() {
  ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const colors = ['#00f0f0','#f0f000','#a000f0','#00f000','#f00000','#0000f0','#f0a000'];
  for (let i = 0; i < 20; i++) {
    drawBlock(ctx, Math.floor(Math.random()*COLS), Math.floor(Math.random()*ROWS), colors[Math.floor(Math.random()*colors.length)], BLOCK);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  const isMobile = window.innerWidth <= 768;
  const mw = isMobile ? canvas.width - 30 : 260, mh = isMobile ? 100 : 110;
  ctx.fillRect(canvas.width/2 - mw/2, canvas.height/2 - mh/2, mw, mh);
  ctx.strokeStyle = '#667eea'; ctx.lineWidth = 2;
  ctx.strokeRect(canvas.width/2 - mw/2, canvas.height/2 - mh/2, mw, mh);
  ctx.fillStyle = '#fff'; ctx.font = `bold ${isMobile ? 24 : 32}px sans-serif`; ctx.textAlign = 'center';
  ctx.fillText('俄罗斯方块', canvas.width/2, canvas.height/2 - 10);
  ctx.font = `${isMobile ? 13 : 15}px sans-serif`; ctx.fillStyle = '#aaa';
  const clickText = isMobile ? '点击屏幕开始' : '按 Enter / 点击画布开始';
  ctx.fillText(clickText, canvas.width/2, canvas.height/2 + 18);
}

canvas.addEventListener('click', () => { if (!gameRunning) startGame(); });
drawStartScreen();
</script>
</body>
</html>
